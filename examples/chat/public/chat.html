<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Degen Park Chat</title>
  <link rel="stylesheet" href="chat-page.css">
</head>
<body>
  <div class="chat-container">
    <ul class="chat-pages">
      <li class="chat-page chat-active">
        <div class="chat-area">
          <div class="chat-user-info">
            <div class="chat-user-details">
              <span class="chat-wallet-address"></span>
              <span class="chat-username"></span>
            </div>
            <button class="chat-disconnect-btn" title="Disconnect and leave chat">
              🚪 Disconnect
            </button>
          </div>
          <ul class="chat-messages"></ul>
        </div>
        <div class="chat-input-section">
          <div id="chatReplyPreview" class="chat-reply-preview hidden">
            <span class="chat-reply-text">Replying to <strong class="chat-reply-username"></strong></span>
            <button class="chat-cancel-reply">×</button>
          </div>
          <input class="chat-input-message" placeholder="Type here..."/>
        </div>
      </li>
      <li class="chat-page username-page">
        <div class="chat-form">
          <h3 class="chat-title">Choose your nickname</h3>
          <p class="chat-wallet-info">Connected wallet: <span class="chat-connected-wallet"></span></p>
          <input class="chat-username-input" type="text" maxlength="14" placeholder="Enter your nickname" />
          <div class="chat-username-note">
            <small>This nickname will be permanently linked to your wallet address</small>
          </div>
        </div>
      </li>
      <li class="chat-page wallet-page chat-active">
        <div class="chat-form">
