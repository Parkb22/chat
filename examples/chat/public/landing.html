<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Chat Widget Demo</title>
  <link rel="stylesheet" href="landing-style.css">
</head>
<body>
  <!-- Main Landing Page -->
  <div class="landing-container">
    <div class="simple-content">
      <div class="logo-section">
        <h1>Degen Park Chat</h1>
        <p class="tagline">Web3 messaging made simple</p>
      </div>
      
      <div class="search-box-mockup">
        <div class="mock-input">
          <span class="placeholder-text">Try the chat widget →</span>
        </div>
      </div>

      <div class="footer-links">
        <a href="#about">About</a>
        <a href="#features">Features</a>
        <a href="#privacy">Privacy</a>
        <a href="#terms">Terms</a>
      </div>
    </div>
  </div>

  <!-- Chat Widget -->
  <div id="chatWidget" class="chat-widget hidden">
    <div class="widget-header">
      <div class="widget-title-section">
        <span class="widget-title">💬 Degen Park Chat</span>
        <div class="widget-status">
          <span id="connectionStatus" class="status-indicator offline">●</span>
          <span id="userCount" class="user-count">0 users</span>
        </div>
      </div>
      <button id="closeChat" class="close-btn">×</button>
    </div>
    <div class="widget-content">
      <iframe id="chatFrame" src="widget.html" frameborder="0"></iframe>
    </div>
  </div>

  <!-- Floating Chat Button -->
  <div id="chatButton" class="chat-button">
    <div class="chat-icon">💬</div>
    <div class="pulse"></div>
    <div id="notificationBadge" class="notification-badge hidden">0</div>
  </div>

  <script src="landing.js"></script>
</body>
</html>
