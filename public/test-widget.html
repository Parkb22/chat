<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Widget Test</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; padding:40px; background:#0b0f14; color:#e6edf3 }
      h1 { margin:0 0 8px 0; font-size:20px }
      p { margin:0 0 20px 0; color:#9aa4af }
      .note { margin-top:16px; font-size:12px; color:#9aa4af }
      .container { max-width:960px; margin:0 auto }
      code { background:#0f172a; border:1px solid #1e293b; padding:2px 6px; border-radius:6px }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Chat Widget Test Page</h1>
      <p>This page embeds the widget via iframe. Replace <code>YOUR_SITE_ID</code> as needed.</p>

      <iframe src="/embed/chat.html?site=YOUR_SITE_ID"
              style="position:fixed;bottom:24px;right:24px;width:360px;height:540px;border:0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:999999"
              allow="clipboard-write"
              referrerpolicy="origin-when-cross-origin"></iframe>

      <div class="note">
        Alternatively, you can load via script (same origin):
        <pre><code>&lt;script src="/chat-widget.js" data-site-id="YOUR_SITE_ID" async&gt;&lt;/script&gt;</code></pre>
      </div>
    </div>
  </body>
  </html>
