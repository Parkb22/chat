<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html,body { margin:0; padding:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b0f14; color:#e6edf3 }
  .wrap { display:flex; flex-direction:column; height:100vh }
  .head { padding:10px 12px; background:#111827; border-bottom:1px solid #1f2937; font-weight:600 }
  .log { flex:1; overflow:auto; padding:12px }
  .msg { padding:8px 10px; border-radius:10px; margin-bottom:8px; max-width:92% }
  .me { background:#1f2937; margin-left:auto }
  .sv { background:#0f172a; border:1px solid #1e293b }
  form { display:flex; gap:8px; padding:10px; border-top:1px solid #1f2937; background:#0b0f14 }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#0b1220; color:#e6edf3 }
  button { padding:10px 12px; border-radius:8px; border:0; background:#2563eb; color:#fff; font-weight:600; cursor:pointer }
  button:disabled { opacity:.6; cursor:not-allowed }
</style>
<div class="wrap">
  <div class="head">Chat</div>
  <div id="log" class="log"></div>
  <form id="f">
    <input id="m" placeholder="Type a message" autocomplete="off" />
    <button>Send</button>
  </form>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
<script>
  const p = new URLSearchParams(location.search);
  const site = p.get('site') || 'default';
  const theme = p.get('theme') || 'dark';
  const log = document.getElementById('log');
  const form = document.getElementById('f');
  const input = document.getElementById('m');

  function add(type, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + (type === 'me' ? 'me' : 'sv');
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    parent.postMessage({ type: 'resize', height: document.body.scrollHeight }, '*');
  }

  const socket = io('/', {
    transports: ['websocket'],
    path: '/socket.io',
    auth: { site }
  });

  socket.on('connect', () => add('sv', 'Connected.'));
  socket.on('disconnect', () => add('sv', 'Disconnected.'));
  socket.on('server:msg', (msg) => add('sv', msg));

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = (input.value || '').trim();
    if (!text) return;
    socket.emit('client:msg', { text });
    add('me', text);
    input.value = '';
  });
</script>
